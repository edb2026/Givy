<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GivyRewardsShop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; font-family: Arial, sans-serif; color: #EDEDED; padding: 20px; }
    h1 { text-align: center; color: #C5A267; margin-bottom: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .filter-btn { background: #1A1A1A; border: 1px solid #333; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; }
    .filter-btn.active { background: #C5A267; color: black; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .product-card { background: #121212; border-radius: 16px; padding: 15px; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-5px); }
    .product-img { background: #1E1E1E; height: 250px; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; position: relative; cursor: pointer; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder { font-size: 60px; }
    .image-counter { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 20px; font-size: 11px; }
    .brand { color: #C5A267; font-size: 12px; }
    .title { font-size: 18px; font-weight: bold; margin: 8px 0; }
    .desc { color: #999; font-size: 13px; margin: 10px 0; line-height: 1.4; }
    .price { color: #C5A267; font-size: 20px; font-weight: bold; }
    .fb-btn { background: #1877F2; border: none; padding: 10px; border-radius: 30px; color: white; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
    .admin-icon { position: fixed; bottom: 20px; left: 20px; width: 40px; height: 40px; background: #C5A267; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0.3; cursor: pointer; z-index: 999; }
    .empty { text-align: center; padding: 50px; color: #666; }
    .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
    .lightbox.active { visibility: visible; opacity: 1; }
    .lightbox img { max-width: 90%; max-height: 85%; object-fit: contain; user-select: none; }
    .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: white; user-select: none; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: white; font-size: 30px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; user-select: none; }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    .lightbox-counter { position: absolute; top: 20px; left: 30px; color: white; font-size: 16px; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; }
    .lightbox-thumbs { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; max-width: 90%; overflow-x: auto; padding: 6px; }
    .lightbox-thumb { width: 50px; height: 50px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
    .lightbox-thumb.active { border-color: #C5A267; }
    .lightbox-thumb img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <h1>🛋️ GivyRewardsShop</h1>
  <div id="filters" class="filters"></div>
  <div id="products" class="product-grid"><div class="empty">Loading...</div></div>
  <div class="admin-icon" id="adminIcon">👑</div>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-counter" id="lbCounter"></div>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
    <div class="lightbox-thumbs" id="lbThumbs"></div>
  </div>

  <script>
    let products = [];
    let categories = ['furniture', 'seating', 'beds', 'rugs', 'decor', 'office'];
    let activeFilter = 'all';
    let globalFb = '';
    let clickCount = 0;
    let lbImages = [];
    let lbIndex = 0;

    function loadData() {
      const savedProducts = localStorage.getItem('givy_products');
      products = savedProducts ? JSON.parse(savedProducts) : [];
      
      const savedCats = localStorage.getItem('givy_categories');
      if(savedCats) categories = JSON.parse(savedCats);
      
      const savedFb = localStorage.getItem('givy_global_fb');
      globalFb = savedFb || '';
      
      renderFilters();
      renderProducts();
    }

    function renderFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = `<button class="filter-btn active" data-cat="all">All</button>`;
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = cat;
          renderProducts();
        };
        container.appendChild(btn);
      });
      // also wire up the "All" button
      container.querySelector('[data-cat="all"]').onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = 'all';
        renderProducts();
      };
    }

    function openLightbox(images, index) {
      if (!images || images.length === 0) return;
      lbImages = images;
      lbIndex = index || 0;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function updateLightbox() {
      document.getElementById('lightboxImg').src = lbImages[lbIndex];
      document.getElementById('lbCounter').textContent = `${lbIndex + 1} / ${lbImages.length}`;
      // nav arrows hidden if only one image
      const showNav = lbImages.length > 1;
      document.querySelector('.lightbox-prev').style.display = showNav ? 'block' : 'none';
      document.querySelector('.lightbox-next').style.display = showNav ? 'block' : 'none';
      // thumbnails
      const thumbs = document.getElementById('lbThumbs');
      if (lbImages.length > 1) {
        thumbs.style.display = 'flex';
        thumbs.innerHTML = lbImages.map((src, i) => `
          <div class="lightbox-thumb ${i === lbIndex ? 'active' : ''}" onclick="jumpLightbox(${i}); event.stopPropagation();">
            <img src="${src}">
          </div>
        `).join('');
      } else {
        thumbs.style.display = 'none';
      }
    }

    function navLightbox(dir) {
      event.stopPropagation();
      lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
      updateLightbox();
    }

    function jumpLightbox(i) {
      lbIndex = i;
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // close when clicking dark backdrop, but not when clicking image/controls
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    // keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft' && lbImages.length > 1) { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; updateLightbox(); }
      else if (e.key === 'ArrowRight' && lbImages.length > 1) { lbIndex = (lbIndex + 1) % lbImages.length; updateLightbox(); }
    });

    function openMessenger(fbUser, productName) {
      let user = fbUser || globalFb;
      if(!user) {
        alert(`Contact seller about: ${productName}\n\nNo Facebook username set. Admin can add it.`);
        return;
      }
      window.open('https://m.me/' + user.replace('@', ''), '_blank');
    }

    function renderProducts() {
      const container = document.getElementById('products');
      const filtered = activeFilter === 'all' ? products : products.filter(p => p.category === activeFilter);
      
      if(filtered.length === 0) {
        container.innerHTML = '<div class="empty">✨ No products</div>';
        return;
      }
      
      container.innerHTML = filtered.map((p, idx) => {
        const images = p.images && p.images.length ? p.images : [];
        const firstImage = images.length > 0 ? images[0] : null;
        const imageCount = images.length;
        const imagesAttr = encodeURIComponent(JSON.stringify(images));
        
        return `
          <div class="product-card">
            <div class="product-img" onclick='openLightbox(JSON.parse(decodeURIComponent("${imagesAttr}")), 0)'>
              ${firstImage ? `<img src="${firstImage}" alt="${escapeHtml(p.name)}">` : '<div class="img-placeholder">🪑</div>'}
              ${imageCount > 1 ? `<div class="image-counter">📷 ${imageCount}</div>` : ''}
            </div>
            <div class="brand">${escapeHtml(p.brand || 'GIVY STUDIO')}</div>
            <div class="title">${escapeHtml(p.name)}</div>
            <div class="desc">${escapeHtml(p.desc || 'Luxury piece')}</div>
            <div class="price">$${p.price}</div>
            <button class="fb-btn" onclick="openMessenger('${p.fbUser || ''}', '${escapeHtml(p.name)}')">💬 Facebook interesting</button>
          </div>
        `;
      }).join('');
    }

    document.getElementById('adminIcon').onclick = () => {
      clickCount++;
      setTimeout(() => clickCount = 0, 500);
      if(clickCount >= 3) location.href = 'admin.html';
    };

    window.addEventListener('storage', (e) => {
      if(e.key === 'givy_products' || e.key === 'givy_categories' || e.key === 'givy_updated') loadData();
    });

    function escapeHtml(str) { return str ? String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
    
    loadData();
  </script>

</body>
</html>
