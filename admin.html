    .upload-btn { background: #2a2a2a; border: 1px solid #C5A267; padding: 10px 15px; border-radius: 30px; color: #C5A267; cursor: pointer; display: inline-flex; gap: 8px; margin-bottom: 10px; }

<script>
  const PASSWORD = "admin123";
  const MAX_IMAGE_DIMENSION = 1200; // resize longest side to this
  const JPEG_QUALITY = 0.75;
  let products = [];
  let categories = ['furniture', 'seating', 'beds', 'rugs', 'decor', 'office'];
  let globalFb = '';
  let currentImages = []; // compressed base64 images for current product
  let currentPreviewImages = [];

  // ========== AUTH ==========
  document.getElementById('loginBtn').onclick = () => {
    const pwd = document.getElementById('password').value;
    if(pwd === PASSWORD) {
      localStorage.setItem('admin_auth', 'true');
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadAll();
    } else {
      alert('Wrong password');
    }
  };
  
  if(localStorage.getItem('admin_auth') === 'true') {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAll();
  }

  // ========== IMAGE COMPRESSION ==========
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          // Resize keeping aspect ratio
          if (width > height) {
            if (width > MAX_IMAGE_DIMENSION) {
              height = Math.round((height * MAX_IMAGE_DIMENSION) / width);
              width = MAX_IMAGE_DIMENSION;
            }
          } else {
            if (height > MAX_IMAGE_DIMENSION) {
              width = Math.round((width * MAX_IMAGE_DIMENSION) / height);
              height = MAX_IMAGE_DIMENSION;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // Always export as JPEG to shrink size (PNG with transparency will get black bg, acceptable for product photos)
          try {
            const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
            resolve(dataUrl);
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = () => reject(new Error('Image load failed'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  // ========== IMAGE PREVIEW ==========
  function renderImagePreview() {
    const grid = document.getElementById('previewGrid');
    if(!grid) return;
    grid.innerHTML = '';
    if(currentPreviewImages.length === 0) {
      grid.innerHTML = '<div style="color:#777; font-size:12px; padding:10px 0;">No images selected. Upload up to 10 photos.</div>';
      return;
    }
    currentPreviewImages.forEach((src, idx) => {
      const div = document.createElement('div');
      div.className = 'preview-img';
      const img = document.createElement('img');
      img.src = src;
      const rm = document.createElement('div');
      rm.className = 'remove-img';
      rm.innerHTML = '✕';
      rm.onclick = (e) => {
        e.stopPropagation();
        currentPreviewImages.splice(idx, 1);
        currentImages.splice(idx, 1);
        renderImagePreview();
      };
      div.appendChild(img);
      div.appendChild(rm);
      grid.appendChild(div);
    });
  }

  document.getElementById('uploadBtn').onclick = () => document.getElementById('imageInput').click();
  document.getElementById('imageInput').onchange = async (e) => {
    const files = Array.from(e.target.files);
    const remaining = 10 - currentPreviewImages.length;
    const toAdd = files.slice(0, remaining);
    const statusEl = document.getElementById('compressStatus');
    let done = 0;
    statusEl.textContent = `⏳ Processing 0/${toAdd.length}...`;

    for (const file of toAdd) {
      if (!file.type.startsWith('image/')) { done++; continue; }
      try {
        const compressed = await compressImage(file);
        currentImages.push(compressed);
        currentPreviewImages.push(compressed);
        renderImagePreview();
      } catch (err) {
        console.error('Compression failed:', err);
      }
      done++;
      statusEl.textContent = `⏳ Processing ${done}/${toAdd.length}...`;
    }
    statusEl.textContent = `✅ ${toAdd.length} image(s) ready`;
    setTimeout(() => { statusEl.textContent = ''; }, 2500);

    e.target.value = '';
    if(toAdd.length < files.length) showToast(`Max 10 images. Added ${toAdd.length} of ${files.length}`);
    updateStorageInfo();
  };

  function resetImages() {
    currentImages = [];
    currentPreviewImages = [];
    renderImagePreview();
  }

  // ========== STORAGE INFO ==========
  function updateStorageInfo() {
    try {
      const data = localStorage.getItem('givy_products') || '';
      const kb = (data.length / 1024).toFixed(1);
      document.getElementById('storageInfo').textContent = `💾 Current storage: ~${kb} KB (browser limit ~5000 KB)`;
    } catch(e) {}
  }

  // ========== LOAD & SAVE ==========
  function loadAll() {
    const storedProducts = localStorage.getItem('givy_products');
    products = storedProducts ? JSON.parse(storedProducts) : [];
    
    const storedCats = localStorage.getItem('givy_categories');
    if(storedCats) categories = JSON.parse(storedCats);
    
    const storedFb = localStorage.getItem('givy_global_fb');
    globalFb = storedFb || '';
    document.getElementById('globalFb').value = globalFb;
    
    renderCategorySelect();
    renderCatList();
    renderProductList();
    document.getElementById('count').innerText = products.length;
    updateStorageInfo();
  }

  function saveAll() {
    try {
      localStorage.setItem('givy_products', JSON.stringify(products));
      localStorage.setItem('givy_categories', JSON.stringify(categories));
      localStorage.setItem('givy_global_fb', globalFb);
      localStorage.setItem('givy_updated', Date.now());
      renderProductList();
      renderCatList();
      renderCategorySelect();
      document.getElementById('count').innerText = products.length;
      updateStorageInfo();
      showToast('✅ Saved');
      return true;
    } catch(err) {
      console.error('Save failed:', err);
      alert('⚠️ Storage limit exceeded!\n\nYour browser cannot save more data. Please:\n• Remove some images from this product\n• Or delete some older products\n\n(Browser localStorage limit is ~5MB)');
      return false;
    }
  }

  function renderCategorySelect() {
    const select = document.getElementById('category');
    select.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  // ========== CATEGORIES ==========
  function renderCatList() {
    const container = document.getElementById('catList');
    container.innerHTML = '';
    categories.forEach((cat, idx) => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:#1E1E1E; padding:10px; margin:5px 0; border-radius:10px;';
      div.innerHTML = `<span>${cat}</span><button onclick="deleteCategory(${idx})" style="background:#aa2e2e; padding:5px 12px;">Delete</button>`;
      container.appendChild(div);
    });
  }

  window.deleteCategory = (idx) => {
    if(confirm('Delete this category?')) {
      categories.splice(idx, 1);
      if(categories.length === 0) categories = ['other'];
      saveAll();
    }
  };

  document.getElementById('addCatBtn').onclick = () => {
    const newCat = document.getElementById('newCat').value.trim().toLowerCase();
    if(newCat && !categories.includes(newCat)) {
      categories.push(newCat);
      document.getElementById('newCat').value = '';
      saveAll();
      showToast(`Category "${newCat}" added`);
    } else {
      alert('Invalid or duplicate category');
    }
  };

  // ========== PRODUCT CRUD ==========
  function clearForm() {
    document.getElementById('name').value = '';
    document.getElementById('brand').value = 'GIVY STUDIO';
    document.getElementById('desc').value = '';
    document.getElementById('price').value = '';
    document.getElementById('fbUser').value = '';
    document.getElementById('editId').value = '';
    resetImages();
    document.getElementById('saveBtn').innerHTML = '💾 Save Product';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('formTitle').innerHTML = '➕ Add New Product';
  }

  document.getElementById('saveBtn').onclick = () => {
    const name = document.getElementById('name').value.trim();
    const price = parseFloat(document.getElementById('price').value);
    if(!name || isNaN(price)) {
      alert('Please fill Name and Price');
      return;
    }
    
    const product = {
      id: Date.now(),
      name: name,
      brand: document.getElementById('brand').value.trim(),
      category: document.getElementById('category').value,
      desc: document.getElementById('desc').value.trim(),
      price: price,
      fbUser: document.getElementById('fbUser').value.trim(),
      images: [...currentImages]
    };
    
    const editId = document.getElementById('editId').value;
    const snapshot = JSON.parse(JSON.stringify(products)); // for rollback
    if(editId) {
      const idx = products.findIndex(p => p.id == editId);
      if(idx !== -1) {
        product.id = parseInt(editId);
        products[idx] = product;
      }
    } else {
      products.push(product);
    }

    if (saveAll()) {
      showToast(editId ? 'Product updated' : `"${name}" added`);
      clearForm();
    } else {
      // rollback on storage failure
      products = snapshot;
    }
  };

  document.getElementById('addMoreBtn').onclick = () => {
    const name = document.getElementById('name').value.trim();
    if(name) document.getElementById('saveBtn').click();
    clearForm();
    showToast('Ready for next product');
  };

  document.getElementById('cancelEditBtn').onclick = () => clearForm();

  window.editProduct = (id) => {
    const p = products.find(p => p.id == id);
    if(!p) return;
    document.getElementById('name').value = p.name;
    document.getElementById('brand').value = p.brand;
    document.getElementById('category').value = p.category;
    document.getElementById('desc').value = p.desc;
    document.getElementById('price').value = p.price;
    document.getElementById('fbUser').value = p.fbUser || '';
    document.getElementById('editId').value = p.id;
    currentImages = p.images ? [...p.images] : [];
    currentPreviewImages = p.images ? [...p.images] : [];
    renderImagePreview();
    document.getElementById('saveBtn').innerHTML = '✏️ Update Product';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('formTitle').innerHTML = '✏️ Edit Product';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteProduct = (id) => {
    if(confirm('Delete this product?')) {
      products = products.filter(p => p.id != id);
      saveAll();
      if(document.getElementById('editId').value == id) clearForm();
      showToast('Product deleted');
    }
  };

  function renderProductList() {
    const container = document.getElementById('productList');
    if(products.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#666;">No products yet</div>';
      return;
    }
    container.innerHTML = products.map(p => `
      <div class="product-item">
        <div>
          <strong style="color:#C5A267;">${escapeHtml(p.name)}</strong><br>
          <span style="color:#888;">${escapeHtml(p.brand)} | ${p.category}</span><br>
          <span style="color:#C5A267;">$${p.price}</span>
          ${p.fbUser ? `<div style="font-size:11px; color:#1877F2;">FB: ${escapeHtml(p.fbUser)}</div>` : ''}
          ${p.images && p.images.length ? `<div style="font-size:11px; color:#C5A267;">📷 ${p.images.length} photo(s)</div>` : ''}
        </div>
        <div>
          <button onclick="editProduct(${p.id})" style="background:#2a5f8a;">✏️ Edit</button>
          <button onclick="deleteProduct(${p.id})" class="btn-del">🗑️ Delete</button>
        </div>
      </div>
    `).join('');
  }

  // ========== FACEBOOK SETTINGS ==========
  document.getElementById('saveGlobalFbBtn').onclick = () => {
    globalFb = document.getElementById('globalFb').value.trim();
    localStorage.setItem('givy_global_fb', globalFb);
    showToast('Global Facebook username saved');
  };

  document.getElementById('syncFBBtn').onclick = () => {
    if(products.length === 0) {
      showToast('No products to sync');
      return;
    }
    console.log('Facebook Commerce Sync:', products);
    showToast(`🚀 ${products.length} products synced to Facebook Commerce Manager`);
  };

  // ========== EXIT ==========
  document.getElementById('exitBtn').onclick = () => {
    window.location.href = 'index.html';
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : ''; }
</script>
